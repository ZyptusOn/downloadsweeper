name: Apple Silicon compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Check native toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc -vV
      - name: Compile and test shared runtime and desktop shell
        run: |
          cargo run --locked -p ds-dev -- verify-share --project-only
          cargo test --locked --no-fail-fast
          cargo build --locked -p ds-web -p ds-cli
          cargo check --locked -p ds-tauri
      - name: Test optional FFmpeg fallback with a synthetic unsupported codec
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          export DS_TEST_MEDIA_BIN="$(brew --prefix ffmpeg)/bin"
          cargo test --locked -p ds-web --test media ffmpeg_fallback_protocols -- --ignored
      - uses: actions/setup-python@v5
        # Only the packaging utility uses Python; all tests above run in Rust.
        with:
          python-version: '3.12'
      - name: Verify portable package
        run: python scripts/package_macos.py --include-cli
